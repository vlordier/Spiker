[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spikerplus"
version = "2.0.3"
description = "Build, train, optimize and generate hardware accelerators for Spiking Neural Networks using VHDL"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    {name = "Alessio Carpegna", email = "alessio.carpegna@polito.it"},
    {name = "Alessandro Savino"},
    {name = "Stefano Di Carlo"}
]
maintainers = [
    {name = "Alessio Carpegna", email = "alessio.carpegna@polito.it"}
]
keywords = ["spiking neural networks", "FPGA", "VHDL", "neuromorphic computing", "edge AI"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "numpy>=1.20",
    "torch>=1.12",
    "snntorch>=0.9.1",
    "tabulate>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/smilies-polito/Spiker"
Repository = "https://github.com/smilies-polito/Spiker.git"
Documentation = "https://github.com/smilies-polito/Spiker#readme"

[project.optional-dependencies]
test = ["pytest>=7.0"]
dev = [
    "ruff>=0.6.0",
    "pre-commit>=3.0",
    "pyupgrade>=3.0.0",
    "mdformat>=0.7.0",
    "typos>=1.0.0",
    "pdoc>=14.0",
]
docs = ["pdoc>=14.0"]

[tool.setuptools.packages.find]
where = ["spiker"]

# --- Ruff configuration (streamlined from ~238 to ~60 lines) ---
[tool.ruff]
line-length = 88
target-version = "py312"
indent-width = 4

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "C90",    # mccabe complexity
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplify
    "RUF",    # ruff-specific
    "ANN",    # flake8-annotations (partial)
    "PTH",    # use pathlib
    "TRY",    # tryceratops
    "D",      # pydocstyle (partial)
    "T20",    # no print
    "ERA",    # no commented-out code
]
ignore = [
    # Annotations
    "ANN002",   # Missing type annotation for *args
    "ANN003",   # Missing type annotation for **kwargs
    "ANN401",   # Dynamically typed (Any) — common in ML code
    # Docstring style (minor — fix incrementally)
    "D101",     # Missing docstring in public method
    "D102",     # Missing docstring in public class
    "D103",     # Missing docstring in __init__
    "D104",     # Missing docstring in public package
    "D107",     # Missing docstring in __init__
    "D200",     # One-line docstring should fit on one line
    "D205",     # Missing blank line after summary
    "D400",     # First line should end with period
    "D401",     # First line should be in imperative mood
    "D413",     # Missing blank line after last section
    "D415",     # First line should end with punctuation
    # Existing code patterns
    "B006",     # Mutable default arguments
    "B008",     # Function call in default argument
    # Naming flexibility
    "N801",     # Class naming convention (test classes)
    "N802",     # Function naming (VHDL templates)
    "N803",     # Argument naming (VHDL templates)
    "N806",     # Variable naming (VHDL templates)
]

[tool.ruff.lint.per-file-ignores]
"spiker/spikerplus/vhdl/*.py" = [
    "T201",    # print found (template generation)
    "F401",    # intentional re-exports in VHDL tools init
    "ANN",     # Annotations not needed in VHDL templates
    "PTH123",  # os.path usage in templates
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
