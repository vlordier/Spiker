    "Q004",    # Unnecessary escape on inner quote character
    "ISC003",  # Explicitly concatenated string should be implicitly concatenated
    "PLR1714", # Consider merging multiple comparisons
    "PIE804",  # Unnecessary dict kwargs
    "PERF102", # When using only the values of a dict use the values() method
    "T201",    # print found
    "PLR1722", # Use sys.exit() instead of exit
    "LOG015",  # warning/info call on root logger
    "PLR0402", # Use from torch import nn in lieu of alias
    "RUF022",  # __all__ is not sorted
    "F401",    # Unused imports (for re-exports)
    "N802",    # Function naming convention
    "N803",    # Argument naming convention
    "N806",    # Variable naming convention
    "A002",    # Function argument shadowing a Python builtin
    "C408",    # Unnecessary dict call
    "PIE790",  # Unnecessary pass statement
    "RET504",  # Unnecessary assignment before return
    "UP031",   # Use format specifiers instead of percent format
    "ISC002",  # Implicitly concatenated string literals
    "Q000",    # Single quotes found but double quotes preferred
    "Q002",    # Single quote docstring found but double quotes preferred
    "E711",    # Comparison to None should be is None
    "E712",    # Avoid equality comparisons to False
    "PTH123",  # open() should be replaced by Path.open()
    "FURB122", # Use of file.write in a for loop
    "S602",    # subprocess call with shell=True
    "S311",    # Standard pseudo-random generators are not suitable for cryptographic purposes
    "PERF401", # Use list.extend to create a transformed list
    "TRY300",  # Consider moving this statement to an else block
    "G002",    # Logging statement uses %
    "ISC002",  # Implicitly concatenated string literals over multiple lines
    "RUF013",  # PEP 484 prohibits implicit Optional
    "F821",    # Undefined name (existing code issues)
    "F841",    # Local variable assigned but never used
    "E501",    # Line too long
    "SIM113",  # Use enumerate() for index variable
    "SIM108",  # Use ternary operator
    "TD002",   # Missing author in TODO
    "TD003",   # Missing issue link for TODO
    "TD005",   # Missing issue description after TODO
    "TD006",   # Invalid TODO capitalization
    "FIX002",  # Line contains TODO
    "B905",    # zip() without explicit strict parameter
    "E721",    # Use is and is not for type comparisons
    "PERF402", # Use list or list.copy to create a copy
    "RET503",  # Missing explicit return
    "RUF015",  # Prefer next(iter()) over single element slice
    "RUF046",  # Value being cast to int is already an integer
    "PTH113",  # os.path.isfile should be replaced by Path.is_file
]
